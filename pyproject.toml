[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-oracle"
version = "0.1.0"
description = "ATP Tennis Prediction System – pre-match ML pipeline with NL agent"
requires-python = ">=3.10"   # upgrade from 3.9 required — see README
dependencies = [
    # Scraping
    "requests>=2.31",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
    "fake-useragent>=2.0",
    "playwright>=1.45",
    # Data
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    # HDFS
    "hdfs>=2.7",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.44",
    # Evaluation / plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Agent / NLP
    "groq>=0.9",
    "boto3>=1.34",
    # Config / CLI
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    # Logging / utils
    "structlog>=24.1",
    "tenacity>=8.2",
    "tqdm>=4.66",
    # Excel parsing (tennis-data.co.uk)
    "openpyxl>=3.1",
    # Web server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
atp-scrape   = "scraper.cli:app"
atp-features = "features.cli:app"
atp-train    = "models.cli:app"
atp-eval     = "models.eval_cli:app"
atp-predict  = "serving.cli:app"
atp-agent    = "agent.cli:app"
atp-serve    = "serving.api:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "scraper*", "storage*", "features*", "models*", "evaluation*", "serving*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
